<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRIPTONSHARE</title>
  <style>
    :root {
      --bg: #121212;
      --lime: #39FF14;
      --green: #4E9B47;
      --text: #E8E8E8;
      --muted: #A0A0A0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 16px auto 8px;
      border: 3px solid rgba(57, 255, 20, 0.2);
      border-top-color: var(--lime);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary {
      background: var(--lime);
      color: #0A0A0F;
    }
    .btn-store {
      background: rgba(78, 155, 71, 0.15);
      color: var(--text);
      border: 1px solid var(--green);
    }
    .stores { display: none; }
    .hidden { display: none; }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #6B6B6B;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/branding/kriptonshare_logo_primary.png" alt="KRIPTONSHARE" />
    <h1 id="title">KRIPTONSHARE</h1>
    <p id="subtitle"></p>

    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>

    <div class="actions">
      <a href="#" id="open-app" class="btn btn-primary hidden"></a>
    </div>
    <div class="stores">
      <a href="#" id="store-google" class="btn btn-store">Google Play</a>
      <a href="#" id="store-apple" class="btn btn-store">App Store</a>
    </div>

    <div class="footer">KRIPTONSHARE &middot; Encriptado &middot; Efímero &middot; Privado</div>
  </div>

  <script>
    (function () {
      // TODO(store): sustituir '#' por los enlaces reales de las tiendas.
      document.getElementById('store-google').href = '#';
      document.getElementById('store-apple').href = '#';

      var path = window.location.pathname; // /room/<id> o /d/<id>
      var segs = path.split('/').filter(Boolean);
      var roomId = segs.length >= 2 ? segs[1] : null;

      var lang = (navigator.language || 'en').toLowerCase();
      var es = lang.indexOf('es') === 0;
      var www = !!/android/i.test(navigator.userAgent);

      function setText(id, text) { document.getElementById(id).textContent = text; }

      if (es) {
        setText('subtitle', 'Data Room seguro con cifrado zero-knowledge. Abre el documento en la app.');
        setText('open-app', 'Abrir en la app');
        setText('status', 'Abriendo la app de KRIPTONSHARE…');
        setText('title', 'KRIPTONSHARE');
      } else {
        setText('subtitle', 'Secure Data Room with zero-knowledge encryption. Open the document in the app.');
        setText('open-app', 'Open in the app');
        setText('status', 'Opening the KRIPTONSHARE app…');
        setText('title', 'KRIPTONSHARE');
      }

      // Mostrar tiendas solo cuando llegan desde un móvil (web no tiene la app).
      if (www) { document.querySelector('.stores').style.display = 'block'; }

      var opened = false;

      function tryOpen() {
        if (!roomId || opened) return;
        opened = true;
        // Intento con custom scheme (Android/iOS).
        window.location.href = 'kriptonshare://room/' + encodeURIComponent(roomId);
        setTimeout(function () {
          var target = 'https://kriptonshare.com/room/' + encodeURIComponent(roomId);
          // Si la app no respondió, mostrar el botón manual en lugar del spinner.
          if (document.visibilityState === 'visible') {
            document.getElementById('spinner').classList.add('hidden');
            document.getElementById('open-app').classList.remove('hidden');
            if (es) {
              setText('status', 'La app no está instalada. Ábrela desde las tiendas o pulsa el botón.');
            } else {
              setText('status', 'The app is not installed. Get it from the stores or tap the button.');
            }
            document.getElementById('open-app').href = target;
          }
        }, 2000);
      }

      document.getElementById('open-app').addEventListener('click', function () { tryOpen(); });
      tryOpen();
    })();
  </script>
</body>
</html>
